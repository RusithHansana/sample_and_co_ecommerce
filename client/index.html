  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <script>
        (function(){
          var t;
          try {
            t = localStorage.getItem('sample-co-theme')
          } catch (error) {
            t = null;
          }
          var d = window.matchMedia('(prefers-color-scheme:dark)').matches;
          var rl = t === "light" || (t === 'system' && !d) || (!t && !d);
          if(rl) document.documentElement.classList.add('light');
          document.documentElement.classList.add('no-transition');
          requestAnimationFrame(function() {
            requestAnimationFrame(function () {
              document.documentElement.classList.remove('no-transitions');
            });
          })
        })();
      </script>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
      <title>Sample & Co.</title>
    </head>
    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
